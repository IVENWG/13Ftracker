name: Institutional Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 2"

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout 13Ftracker repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pipenv"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --deploy

      - name: Fetch SEC data and build institutional artifacts
        env:
          GITHUB_ACTIONS: "true"
        run: pipenv run python scripts/fetch_and_build.py

      - name: Commit data updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update institutional filings and artifacts"
          file_pattern: database/** data/institutional/**
