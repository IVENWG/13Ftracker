name: Institutional Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 2"

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 13Ftracker repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f Pipfile ]; then pip install pipenv && pipenv install --dev; fi

      - name: Build institutional data
        run: python scripts/build_institutional_data.py --source database --output data/institutional

      - name: Commit data updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: update institutional toolbox artifacts"
          file_pattern: data/institutional/**
